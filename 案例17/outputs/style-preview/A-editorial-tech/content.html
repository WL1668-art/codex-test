  <section class="layer one"><div class="num">01</div><h2>基础设定</h2><div class="question">WHAT EXISTS</div><div class="answer">写清时间、地点、人物与参考图中的关键关系。</div></section>
  <section class="layer two"><div class="num">02</div><h2>质感 / 画面语言</h2><div class="question">HOW IT FEELS</div><div class="answer">确定风格、影调、景别、构图与运镜边界。</div></section>
  <section class="layer three"><div class="num">03</div><h2>具体画面内容</h2><div class="question">WHAT HAPPENS</div><div class="answer">交代动作、动机和预期结果，让镜头有因果。</div></section>
