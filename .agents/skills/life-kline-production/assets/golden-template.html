    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: clip;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, var(--paper-wash), transparent 28rem),
        linear-gradient(135deg, var(--paper-grain) 25%, transparent 25%) 0 0 / 22px 22px,
        var(--paper);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      transition: color 220ms ease, background-color 220ms ease;
    }

    button { font: inherit; touch-action: manipulation; }

    .page {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 46px;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--vermilion);
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 74px);
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .subtitle {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .state-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 178px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 12px;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }

    .stage {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .chapter-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      overscroll-behavior-inline: contain;
      touch-action: pan-x;
      border-bottom: 1px solid var(--line);
      font-family: system-ui, sans-serif;
    }

    .chapter-tab {
      position: relative;
      padding: 10px 14px 9px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .chapter-tab::after {
      position: absolute;
      right: 16%;
      bottom: -1px;
      left: 16%;
      height: 2px;
      border-radius: 2px;
      background: var(--chapter-color);
      content: "";
      opacity: 0.78;
    }

    .chart-wrap {
      position: relative;
      height: min(55vw, 570px);
      min-height: 430px;
    }

    .gate-panel {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 72px 24px 34px;
      background: linear-gradient(180deg, var(--gate-mask-top), var(--gate-mask-bottom));
    }

    .gate-panel[hidden] { display: none; }

    .gate-card {
      width: min(520px, 100%);
      padding: 25px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--gate-card);
      box-shadow: var(--gate-shadow);
      text-align: center;
    }

    .gate-kicker {
      margin: 0 0 8px;
      color: var(--purple);
      font: 700 11px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
    }

    .gate-card h2 {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 600;
    }

    .gate-card p {
      margin: 12px auto 18px;
      color: var(--muted);
      font: 13px/1.8 system-ui, sans-serif;
    }

    .gate-button {
      min-width: 180px;
      min-height: 46px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: var(--button-text);
      background: var(--purple);
      box-shadow: var(--button-shadow);
      cursor: pointer;
      font: 700 14px system-ui, sans-serif;
    }

    .gate-hint {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font: 11px system-ui, sans-serif;
    }

    #chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    .chart-caption {
      position: absolute;
      top: 16px;
      left: 20px;
      display: flex;
      gap: 18px;
      align-items: center;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      pointer-events: none;
    }

    .legend-item { display: flex; gap: 6px; align-items: center; }
    .legend-mark { width: 15px; height: 3px; border-radius: 3px; }

    .readout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);
      border-top: 1px solid var(--line);
    }

    .story {
      min-height: 202px;
      padding: 24px 28px 26px;
      border-right: 1px solid var(--line);
    }

    .story-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      margin-bottom: 13px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 12px;
    }

    .story-year {
      color: var(--vermilion);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge {
      padding: 4px 9px;
      border: 1px solid var(--badge-border);
      border-radius: 999px;
      background: var(--badge-bg);
    }

    .story h2 {
      margin: 0;
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 600;
      line-height: 1.25;
    }

    .story p {
      max-width: 820px;
      margin: 14px 0 0;
      color: var(--story-text);
      font-size: 15px;
      line-height: 1.9;
    }

    .controls {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding: 22px 26px;
      background: var(--controls-bg);
    }

    .theme-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }

    .theme-picker {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font: 11px system-ui, sans-serif;
    }

    .theme-picker select,
    .theme-toggle {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--control-bg);
      cursor: pointer;
      font: 12px system-ui, sans-serif;
    }

    .theme-picker select {
      min-width: 102px;
      padding: 0 30px 0 12px;
    }

    .theme-toggle {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 0 12px;
    }

    .theme-toggle .moon-mark { color: var(--purple); font-size: 16px; line-height: 1; }

    body,
    .stage,
    .state-chip,
    .gate-panel,
    .gate-card,
    .controls,
    .control-row button,
    .theme-picker select,
    .theme-toggle,
    .timeline-card,
    .badge {
      transition: color 220ms ease, background-color 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .control-row button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: var(--control-bg);
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .control-row button:hover {
      border-color: var(--accent-mid);
      background: var(--control-hover);
      transform: translateY(-1px);
    }

    .control-row button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
    }

    .control-row button:focus-visible,
    .gate-button:focus-visible,
    .theme-picker select:focus-visible,
    .theme-toggle:focus-visible,
    .timeline-card:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
    }

    #playButton {
      color: var(--button-text);
      border-color: var(--purple);
      background: var(--purple);
    }

    .progress-line {
      height: 3px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--progress-track);
    }

    .progress-line span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--vermilion), var(--purple));
      transition: width 280ms ease;
    }

    .control-status {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 11px;
    }

    .timeline-section { min-width: 0; margin-top: 22px; overflow: hidden; }

    .timeline-heading {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: baseline;
      margin: 0 2px 10px;
    }

    .timeline-heading h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .timeline-heading p { margin: 0; color: var(--muted); font-size: 12px; }

    .timeline {
      display: grid;
      grid-auto-columns: minmax(148px, 1fr);
      grid-auto-flow: column;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 3px 18px;
      scrollbar-color: var(--accent-mid) transparent;
      scroll-behavior: auto;
      overscroll-behavior-inline: contain;
      touch-action: pan-x;
    }

    .timeline-card {
      position: relative;
      min-height: 92px;
      padding: 13px 13px 12px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: var(--surface-soft);
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .timeline-card::before {
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--chapter-color);
      content: "";
      opacity: 0.78;
    }

    .timeline-card:hover { transform: translateY(-2px); }

    .timeline-card.active {
      background: var(--surface-strong);
      box-shadow: var(--active-shadow);
      transform: translateY(-3px);
    }

    .timeline-card .year {
      display: block;
      margin-bottom: 8px;
      color: var(--chapter-color);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
    }

    .timeline-card .title {
      display: block;
      font-size: 14px;
      line-height: 1.45;
    }

    #errorBadge {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 9;
      display: none;
      max-width: min(520px, calc(100vw - 28px));
      padding: 10px 14px;
      border-radius: 7px;
      color: #fff;
      background: #8c2828;
      font: 12px/1.5 system-ui, sans-serif;
    }

    @media (max-width: 860px) {
      .page { width: min(100% - 22px, 1480px); padding-top: 22px; }

  <script>

      { year: 1398, age: 70, title: "洪武帝崩", open: 88, high: 92, low: 0, close: 0, volume: 100, chapter: "高位余震", phase: "终局归零", note: "朱元璋病逝于南京，个人权力曲线终止并将帝国交给皇太孙朱允炆。" }

    const chapterNames = ["乱世低开", "义军起势", "逐鹿天下", "洪武定盘", "高位余震"];

      "洪武定盘": "var(--chapter-4)",
      "高位余震": "var(--chapter-5)"
    };

    };
    const stateLabels = {

      travel: "节点旅行",
      focus: "重点停留",
      chapterReview: "章节回望",
      globalReview: "全局回望"
    };
    const focusNodes = new Set([1, 4, 9, 11, 15, 16, 20, 22, 24, 25, 26]);
    const chapterRanges = chapterNames.map((chapter) => {
      const indices = candles.map((d, i) => d.chapter === chapter ? i : -1).filter(i => i >= 0);
      return { chapter, start: indices[0], end: indices[indices.length - 1] };

    const canvas = document.getElementById("chart");

    const timeline = document.getElementById("timeline");
    const chapterStrip = document.getElementById("chapterStrip");
    const playButton = document.getElementById("playButton");

    const nextButton = document.getElementById("nextButton");

    const gateKicker = document.getElementById("gateKicker");
    const gateTitle = document.getElementById("gateTitle");
    const gateCopy = document.getElementById("gateCopy");
    const gateButton = document.getElementById("gateButton");
    const gateHint = document.querySelector(".gate-hint");
    const themeSelect = document.getElementById("themeSelect");
    const themeToggle = document.getElementById("themeToggle");
    const themeToggleText = document.getElementById("themeToggleText");
    const WORLD_STEP = 86;
    const WORLD_START = 68;
    const TRAJECTORY_MOVE_MS = 4000;
    const CANDLE_DELAY_MS = 220;
    const VOLUME_DELAY_MS = 140;
    const CANDLE_ANIMATION_MS = 140;
    const VOLUME_ANIMATION_MS = 150;
    const SEGMENT_MOVE_MS = TRAJECTORY_MOVE_MS / (candles.length - 1);
    const CAMERA_ZOOM = Object.freeze({
      travel: 1,
      focus: 1.12,
      chapterReview: 0.82,
      globalReview: 0.5
    });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const playback = {
      state: "opening",
      playing: false,
      nextAt: Infinity,
      reviewedChapter: null
    };
    const selection = { index: 0 };
    const revealProgress = {
      line: 0,
      movementMs: 0,
      activeMs: 0,
      chapterIndex: 0,

      candle: Array(candles.length).fill(0),
      volume: Array(candles.length).fill(0)
    };
    const camera = {
      x: WORLD_START,
      targetX: WORLD_START,
      y: 50,
      targetY: 50,
      zoom: CAMERA_ZOOM.travel,
      targetZoom: CAMERA_ZOOM.travel,

    function refreshThemeColors() {
      const styles = getComputedStyle(document.documentElement);

        grid: read("--canvas-grid"),

        labelText: read("--canvas-label-text"),
        opening: read("--canvas-opening"),
        openingMuted: read("--canvas-opening-muted")
      };
    }

    function applyTheme(theme) {
      if (!Object.hasOwn(themeNames, theme)) return;
      if (theme !== "anye") themeState.previousLight = theme;
      themeState.current = theme;
      document.documentElement.dataset.theme = theme;
      themeSelect.value = theme;
      const isDark = theme === "anye";
      themeToggleText.textContent = isDark ? themeNames[themeState.previousLight] : "暗夜盘";
      themeToggle.setAttribute("aria-label", isDark ? `返回${themeNames[themeState.previousLight]}` : "切换到暗夜盘");
      themeToggle.title = themeToggle.getAttribute("aria-label");
      refreshThemeColors();
    }

    function setupThemeUI() {
      themeSelect.addEventListener("change", () => applyTheme(themeSelect.value));
      themeToggle.addEventListener("click", () => {
        applyTheme(themeState.current === "anye" ? themeState.previousLight : "anye");
      });
      applyTheme("mushan");
    }

    function validateData() {
      const allowed = new Set(chapterNames);
      const errors = [];
      if (candles.length !== 27) errors.push(`节点数为 ${candles.length}`);
      candles.forEach((d, i) => {
        const values = [d.open, d.high, d.low, d.close, d.volume];
        if (values.some(v => v < 0 || v > 100)) errors.push(`第 ${i + 1} 条越界`);
        if (d.low > d.open || d.low > d.close || d.open > d.high || d.close > d.high) errors.push(`第 ${i + 1} 条K线关系错误`);
        if (!allowed.has(d.chapter)) errors.push(`第 ${i + 1} 条章节错误`);
        if (i > 0 && d.open !== candles[i - 1].close) errors.push(`第 ${i + 1} 条不连续`);
      });
      if (errors.length) throw new Error(errors.join("；"));
      return true;
    }

    function setupStaticUI() {
      chapterStrip.innerHTML = chapterNames.map(name =>
        `<div class="chapter-tab" style="--chapter-color:${chapterColors[name]}">${name}</div>`
      ).join("");

      timeline.innerHTML = candles.map((d, i) => `
        <button class="timeline-card" type="button" data-index="${i}" style="--chapter-color:${chapterColors[d.chapter]}" aria-label="跳转到 ${d.year} 年：${d.title}">
          <span class="year">${d.year}</span>
          <span class="title">${d.title}</span>
        </button>
      `).join("");

      timeline.addEventListener("click", (event) => {
        const card = event.target.closest(".timeline-card");
        if (!card || playback.state === "opening" || playback.state === "chapterReview") return;
        jumpTo(Number(card.dataset.index), true);
      });
    }

    function syncPlaybackControls() {
      const atGate = playback.state === "opening" || playback.state === "chapterReview";
      const finalChapterGate = playback.state === "chapterReview" && selection.index === candles.length - 1;
      const touchGuidance = window.matchMedia("(pointer: coarse)").matches || window.innerWidth <= 860;
      gatePanel.hidden = !atGate;
      prevButton.disabled = atGate;
      nextButton.disabled = atGate;

      if (playback.state === "opening") {
        gateKicker.textContent = "OPENING";
        gateTitle.textContent = "故事尚未开始";
        gateCopy.textContent = "从乱世最低处出发，沿二十七个节点走完七十年人生。";
        gateButton.textContent = "开始播放";
        playButton.textContent = "开始播放";
        gateHint.textContent = touchGuidance ? "轻点开始播放" : "桌面端可按空格键";
      } else if (playback.state === "chapterReview") {
        const range = chapterRanges.find(r => r.chapter === candles[selection.index].chapter);
        const chapterNumber = chapterRanges.indexOf(range) + 1;
        gateKicker.textContent = `CHAPTER ${chapterNumber} / ${chapterRanges.length}`;
        gateTitle.textContent = `${range.chapter} · 本章回望`;
        gateCopy.textContent = `${candles[range.start].year}—${candles[range.end].year}，本章停在“${candles[range.end].title}”。${finalChapterGate ? "继续后展开完整人生走势。" : "继续后进入下一章。"}`;
        gateButton.textContent = finalChapterGate ? "进入全局回望" : "继续下一章";
        playButton.textContent = gateButton.textContent;
        gateHint.textContent = touchGuidance
          ? (finalChapterGate ? "轻点进入全局回望" : "轻点继续下一章")
          : "桌面端可按空格键";
      } else if (playback.state === "globalReview") {
        playButton.textContent = "重新播放";
      } else {
        playButton.textContent = playback.playing ? "暂停" : "继续播放";
      }
      playButton.setAttribute("aria-label", playButton.textContent);
    }

    function setPlaybackState(state, delay = Infinity) {
      playback.state = state;
      playback.nextAt = playback.playing && Number.isFinite(delay) ? performance.now() + delay : Infinity;
      document.body.dataset.playbackState = state;
      document.getElementById("stateLabel").textContent = stateLabels[state];
      syncPlaybackControls();
    }

    function worldX(index) { return WORLD_START + index * WORLD_STEP; }
    function worldXAt(progress) { return WORLD_START + progress * WORLD_STEP; }

    function verticalView(start, end, minSpan = 36, padding = 7) {
      const segment = candles.slice(start, end + 1);
      const low = Math.min(...segment.map(d => d.low));
      const high = Math.max(...segment.map(d => d.high));
      const span = Math.min(100, Math.max(minSpan, high - low + padding * 2));
      const half = span / 2;
      const center = Math.max(half, Math.min(100 - half, (low + high) / 2));
      return { center, span };
    }

    function setCameraTargets(x, zoom, view, compensateZoom = false, fast = false) {
      camera.targetX = x;
      camera.targetZoom = zoom;
      camera.targetY = view.center;
      camera.targetValueZoom = (100 / view.span) / (compensateZoom ? zoom : 1);
      camera.settling = true;
      camera.fastCatchUp = fast;
    }

    function setCameraForState(fast = false) {
      if (playback.state === "globalReview") {
        setCameraTargets(
          (worldX(0) + worldX(candles.length - 1)) / 2,
          CAMERA_ZOOM.globalReview,
          { center: 50, span: 100 },
          true,
          fast
        );
        return;
      }
      if (playback.state === "chapterReview") {
        const range = chapterRanges.find(r => r.chapter === candles[selection.index].chapter);
        const baseScale = chartWidth < 700 ? 0.62 : 0.78;
        const reviewCenter = (worldX(range.start) + worldX(range.end)) / 2;
        const reviewLead = chartWidth >= 900 ? chartWidth * 0.29 / (baseScale * CAMERA_ZOOM.chapterReview) : 0;
        setCameraTargets(
          reviewCenter + reviewLead,
          CAMERA_ZOOM.chapterReview,
          verticalView(range.start, range.end, 42, 7),
          true,
          fast
        );
        return;
      }
      const range = chapterRanges.find(r => selection.index >= r.start && selection.index <= r.end);
      const viewEnd = Math.min(range.end, selection.index + 1);
      const zoom = playback.state === "focus" ? CAMERA_ZOOM.focus : CAMERA_ZOOM.travel;
      setCameraTargets(worldX(selection.index), zoom, verticalView(range.start, viewEnd), false, fast);
    }

    function setCameraForNextChapter(fast = false) {
      const range = chapterRanges[revealProgress.chapterIndex];
      const zoom = focusNodes.has(range.start) ? CAMERA_ZOOM.focus : CAMERA_ZOOM.travel;
      setCameraTargets(worldX(range.start), zoom, verticalView(range.start, Math.min(range.end, range.start + 1)), false, fast);
    }

    function snapCameraToTargets() {
      camera.x = camera.targetX;
      camera.y = camera.targetY;
      camera.zoom = camera.targetZoom;
      camera.valueZoom = camera.targetValueZoom;
      camera.settling = false;
      camera.fastCatchUp = false;
    }

    function setTimelineTarget(index) {
      const activeCard = document.querySelector(`.timeline-card[data-index="${index}"]`);
      if (!activeCard) return;
      const desired = activeCard.offsetLeft + activeCard.offsetWidth / 2 - timeline.clientWidth / 2;
      timelineFollow.target = Math.max(0, Math.min(timeline.scrollWidth - timeline.clientWidth, desired));
    }

    function setChapterTarget(index, force = false) {
      const chapterIndex = chapterRanges.findIndex(range => index >= range.start && index <= range.end);
      if (chapterIndex < 0 || (!force && chapterIndex === setChapterTarget.currentIndex)) return;
      setChapterTarget.currentIndex = chapterIndex;
      if (window.innerWidth > 860) {
        chapterStrip.scrollLeft = 0;
        return;
      }
      const activeTab = chapterStrip.children[chapterIndex];
      if (!activeTab) return;
      const desired = activeTab.offsetLeft + activeTab.offsetWidth / 2 - chapterStrip.clientWidth / 2;
      const target = Math.max(0, Math.min(chapterStrip.scrollWidth - chapterStrip.clientWidth, desired));
      chapterStrip.scrollTo({ left: target, behavior: reducedMotion.matches ? "auto" : "smooth" });
    }
    setChapterTarget.currentIndex = -1;

    function updateStory() {
      const d = candles[selection.index];
      document.getElementById("storyYear").textContent = `${d.year} 年`;
      document.getElementById("storyAge").textContent = `约 ${d.age} 岁`;
      document.getElementById("storyChapter").textContent = d.chapter;
      document.getElementById("storyPhase").textContent = d.phase;
      document.getElementById("storyTitle").textContent = d.title;
      document.getElementById("storyNote").textContent = d.note;
      document.getElementById("nodeCounter").textContent = `节点 ${selection.index + 1} / ${candles.length}`;
      document.getElementById("revealCounter").textContent = `已揭示 ${selection.index + 1} / ${candles.length}`;
      document.getElementById("progressFill").style.width = `${((selection.index + 1) / candles.length) * 100}%`;
      document.querySelectorAll(".timeline-card").forEach((card, i) => {
        card.classList.toggle("active", i === selection.index);
        card.setAttribute("aria-current", i === selection.index ? "step" : "false");
      });
      setTimelineTarget(selection.index);
      setChapterTarget(selection.index);
      syncPlaybackControls();
    }

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - clamp01(value), 3);
    }

    function syncRevealTo(index) {
      revealProgress.line = index;
      revealProgress.movementMs = index * SEGMENT_MOVE_MS;
      revealProgress.activeMs = Math.max(revealProgress.activeMs, CANDLE_DELAY_MS + VOLUME_DELAY_MS + VOLUME_ANIMATION_MS);
      revealProgress.chapterIndex = Math.max(0, chapterRanges.findIndex(range => index >= range.start && index <= range.end));
      revealProgress.crossedAt.fill(null);
      revealProgress.candle.fill(0);
      revealProgress.volume.fill(0);
      for (let i = 0; i <= index; i += 1) {
        revealProgress.crossedAt[i] = 0;
        revealProgress.candle[i] = 1;
        revealProgress.volume[i] = 1;
      }
    }

    function jumpTo(index, userInitiated = false) {
      selection.index = Math.max(0, Math.min(candles.length - 1, index));
      syncRevealTo(selection.index);
      if (userInitiated) {
        playback.playing = false;
      }
      setPlaybackState(focusNodes.has(selection.index) ? "focus" : "travel");
      updateStory();
      setCameraForState(userInitiated);
      timeline.scrollLeft = timelineFollow.target;
    }

    function continueFromGate() {
      if (playback.state === "opening") {
        playback.playing = true;
        selection.index = 0;
        const firstState = focusNodes.has(0) ? "focus" : "travel";
        setPlaybackState(firstState);
        setCameraForState();
      } else if (playback.state === "chapterReview") {
        if (selection.index === candles.length - 1) {
          syncRevealTo(candles.length - 1);
          playback.playing = false;
          setPlaybackState("globalReview");
          setCameraForState();
        } else {
          revealProgress.chapterIndex += 1;
          playback.playing = true;
          setPlaybackState(focusNodes.has(selection.index) ? "focus" : "travel");
          setCameraForNextChapter();
        }
      } else {
        return;
      }
      updateStory();
    }

    function advanceStateMachine(dt) {
      if (!playback.playing || (playback.state !== "travel" && playback.state !== "focus")) return;

      const range = chapterRanges[revealProgress.chapterIndex];
      const chapterMovementLimit = range.end * SEGMENT_MOVE_MS;
      const previousLine = revealProgress.line;
      revealProgress.activeMs += dt;

      if (revealProgress.movementMs < chapterMovementLimit) {
        revealProgress.movementMs = Math.min(chapterMovementLimit, revealProgress.movementMs + dt);
        revealProgress.line = revealProgress.movementMs / SEGMENT_MOVE_MS;
        const firstCrossed = Math.floor(previousLine) + 1;
        const lastCrossed = Math.floor(revealProgress.line + 0.000001);
        for (let i = firstCrossed; i <= lastCrossed; i += 1) {
          if (i >= candles.length || revealProgress.crossedAt[i] !== null) continue;
          const span = revealProgress.line - previousLine;
          const fraction = span > 0 ? (i - previousLine) / span : 1;
          revealProgress.crossedAt[i] = revealProgress.activeMs - dt + dt * clamp01(fraction);
        }
      }

      let newestEvent = selection.index;
      for (let i = 1; i < candles.length; i += 1) {
        const crossedAt = revealProgress.crossedAt[i];
        if (crossedAt === null) continue;
        const elapsed = revealProgress.activeMs - crossedAt;
        revealProgress.candle[i] = Math.max(revealProgress.candle[i], easeOutCubic((elapsed - CANDLE_DELAY_MS) / CANDLE_ANIMATION_MS));
        revealProgress.volume[i] = Math.max(revealProgress.volume[i], easeOutCubic((elapsed - CANDLE_DELAY_MS - VOLUME_DELAY_MS) / VOLUME_ANIMATION_MS));
        if (elapsed >= CANDLE_DELAY_MS) newestEvent = Math.max(newestEvent, i);
      }

      if (newestEvent !== selection.index) {
        selection.index = newestEvent;
        setPlaybackState(focusNodes.has(selection.index) ? "focus" : "travel");
        updateStory();
        setCameraForState();
      }

      if (revealProgress.line >= range.end && revealProgress.volume[range.end] >= 0.999) {
        playback.reviewedChapter = range.chapter;
        playback.playing = false;
        setPlaybackState("chapterReview");
        setCameraForState();
      }
    }

    function togglePlay() {
      if (playback.state === "opening" || playback.state === "chapterReview") {
        continueFromGate();
        return;
      }
      if (playback.state === "globalReview") {
        restart();
        return;
      }
      playback.playing = !playback.playing;
      playback.nextAt = Infinity;
      camera.settling = playback.playing;
      syncPlaybackControls();
    }

    function restart() {
      playback.playing = false;
      playback.reviewedChapter = null;
      selection.index = 0;
      revealProgress.activeMs = 0;
      syncRevealTo(0);
      timeline.scrollLeft = 0;
      timelineFollow.target = 0;
      setPlaybackState("opening");
      setCameraForState();
      snapCameraToTargets();
      updateStory();
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      chartWidth = rect.width;
      chartHeight = rect.height;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      setCameraForState();
    }

    function screenX(index) {
      const baseScale = horizontalWorldScale();
      return chartWidth / 2 + (worldX(index) - camera.x) * baseScale * camera.zoom;
    }

    function screenXAt(progress) {
      const baseScale = horizontalWorldScale();
      return chartWidth / 2 + (worldXAt(progress) - camera.x) * baseScale * camera.zoom;
    }

    function horizontalWorldScale() {
      const baseScale = chartWidth < 700 ? 0.62 : 0.78;
      if (chartWidth >= 700 || playback.state !== "globalReview") return baseScale;
      const worldSpan = (candles.length - 1) * WORLD_STEP;
      const safeInset = chartWidth <= 560 ? 54 : 35;
      return Math.min(baseScale, Math.max(0.1, (chartWidth - safeInset * 2) / (worldSpan * Math.max(camera.zoom, 0.001))));
    }

    function mobileGlobalYearTicks() {
      const lastIndex = candles.length - 1;
      const maxTicks = Math.max(6, Math.min(9, Math.floor((chartWidth - 108) / 38)));
      const selected = [];
      const labelWidth = index => String(candles[index].year).length * 6 + 8;
      const canFit = index => selected.every(other =>
        Math.abs(screenX(index) - screenX(other)) >= (labelWidth(index) + labelWidth(other)) / 2 + 6
      );
      const add = index => {
        if (!selected.includes(index) && canFit(index)) selected.push(index);
      };

      [0, lastIndex, selection.index].forEach(add);
      chapterRanges.map(range => range.start).forEach(add);

      while (selected.length < maxTicks) {
        let candidate = -1;
        let bestDistance = -1;
        for (let index = 0; index <= lastIndex; index += 1) {
          if (selected.includes(index) || !canFit(index)) continue;
          const distance = Math.min(...selected.map(other => Math.abs(screenX(index) - screenX(other))));
          if (distance > bestDistance) {
            bestDistance = distance;
            candidate = index;
          }
        }
        if (candidate < 0) break;
        selected.push(candidate);
      }
      return new Set(selected);
    }

    function valueY(value) {
      const top = 48;
      const plotBottom = chartHeight - 142;
      const plotCenter = (top + plotBottom) / 2;
      return plotCenter - ((value - camera.y) / 100) * (plotBottom - top) * camera.valueZoom * camera.zoom;
    }

    function roundedRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, Math.abs(width) / 2, Math.abs(height) / 2);
      context.beginPath();
      context.roundRect(x, y, width, height, r);
    }

    function drawChart() {
      ctx.clearRect(0, 0, chartWidth, chartHeight);
      const plotLeft = 54;
      const plotRight = chartWidth - 22;
      const plotTop = 48;
      const plotBottom = chartHeight - 142;
      const volumeTop = chartHeight - 105;
      const volumeBottom = chartHeight - 37;
      const adaptiveMobileYears = chartWidth <= 560 && playback.state === "globalReview"
        ? mobileGlobalYearTicks()
        : null;

      ctx.save();
      ctx.font = "11px system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      [0, 25, 50, 75, 100].forEach(value => {
        const y = valueY(value);
        if (y < plotTop - 1 || y > plotBottom + 1) return;
        ctx.strokeStyle = value === 0 ? themeColors.gridZero : themeColors.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(plotLeft, y);
        ctx.lineTo(plotRight, y);
        ctx.stroke();
        ctx.fillStyle = themeColors.axis;
        ctx.fillText(String(value), plotLeft - 10, y);
      });
      ctx.fillStyle = themeColors.muted;
      ctx.textAlign = "left";
      ctx.fillText("冲击量", plotLeft, volumeTop - 13);
      ctx.restore();

      const lineHead = Math.min(candles.length - 1, revealProgress.line);
      const lastLineNode = Math.floor(lineHead);
      if (lineHead >= 0) {
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= lastLineNode; i += 1) {
          const d = candles[i];
          const x = screenX(i);
          const y = valueY(d.close);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        if (lineHead > lastLineNode && lastLineNode < candles.length - 1) {
          const fraction = lineHead - lastLineNode;
          const value = candles[lastLineNode].close + (candles[lastLineNode + 1].close - candles[lastLineNode].close) * fraction;
          ctx.lineTo(screenXAt(lineHead), valueY(value));
        }
        ctx.strokeStyle = themeColors.trajectory;
        ctx.lineWidth = 2.1;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        const headValue = lineHead === lastLineNode || lastLineNode === candles.length - 1
          ? candles[lastLineNode].close
          : candles[lastLineNode].close + (candles[lastLineNode + 1].close - candles[lastLineNode].close) * (lineHead - lastLineNode);
        ctx.setLineDash([]);
        ctx.fillStyle = themeColors.trajectoryHead;
        ctx.beginPath();
        ctx.arc(screenXAt(lineHead), valueY(headValue), 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      candles.forEach((d, i) => {
        const candleAmount = revealProgress.candle[i];
        const volumeAmount = revealProgress.volume[i];
        if (candleAmount <= 0 && volumeAmount <= 0) return;
        const x = screenX(i);
        if (x < -50 || x > chartWidth + 50) return;
        const rising = d.close >= d.open;
        const color = rising ? themeColors.rising : themeColors.falling;
        const candleScale = 0.84 + candleAmount * 0.16;
        const currentScale = i === selection.index ? (playback.state === "focus" ? 1.08 : 1.04) : 1;
        const bodyWidth = Math.max(7, 15 * camera.zoom) * candleScale * currentScale;
        const openY = valueY(d.open);
        const closeY = valueY(d.close);
        const highY = valueY(d.high);
        const lowY = valueY(d.low);
        const candleCenterY = (highY + lowY) / 2;
        const scaledOpenY = candleCenterY + (openY - candleCenterY) * candleScale;
        const scaledCloseY = candleCenterY + (closeY - candleCenterY) * candleScale;
        const scaledHighY = candleCenterY + (highY - candleCenterY) * candleScale;
        const scaledLowY = candleCenterY + (lowY - candleCenterY) * candleScale;
        const bodyTop = Math.min(scaledOpenY, scaledCloseY);
        const bodyHeight = Math.max(3, Math.abs(scaledCloseY - scaledOpenY));

        ctx.save();
        ctx.globalAlpha = candleAmount;
        if (i === selection.index) {
          const pulse = reducedMotion.matches ? 0.35 : (Math.sin(performance.now() / 360) + 1) / 2;
          const emphasisRadius = 24 + pulse * 2.5;
          const gradient = ctx.createRadialGradient(x, (highY + lowY) / 2, 2, x, (highY + lowY) / 2, emphasisRadius);
          gradient.addColorStop(0, themeColors.glowStart);
          gradient.addColorStop(1, themeColors.glowEnd);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, (highY + lowY) / 2, emphasisRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = themeColors.ring;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x, (highY + lowY) / 2, 18 + pulse * 1.5, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = i === selection.index ? 2.2 : 1.45;
        ctx.beginPath();
        ctx.moveTo(x, scaledHighY);
        ctx.lineTo(x, scaledLowY);
        ctx.stroke();

        ctx.fillStyle = color;
        roundedRect(ctx, x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight, 2);
        ctx.fill();
        if (i === selection.index) {
          ctx.strokeStyle = themeColors.candleEdge;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        if (volumeAmount > 0) {
          const volumeHeight = (d.volume / 100) * (volumeBottom - volumeTop) * volumeAmount;
          ctx.globalAlpha = volumeAmount * (i === selection.index ? 0.78 : 0.35);
          ctx.fillStyle = color;
          roundedRect(ctx, x - bodyWidth / 2, volumeBottom - volumeHeight, bodyWidth, volumeHeight, 2);
          ctx.fill();
        }

        ctx.globalAlpha = candleAmount;
        ctx.fillStyle = i === selection.index ? themeColors.year : themeColors.yearMuted;
        ctx.font = `${i === selection.index ? 700 : 500} 10px system-ui, sans-serif`;
        ctx.textAlign = "center";
        const compactGlobalYears = chartWidth < 700 && playback.state === "globalReview";
        const showYear = adaptiveMobileYears
          ? adaptiveMobileYears.has(i)
          : (!compactGlobalYears || i === 0 || i === candles.length - 1 || i % 3 === 0 || i === selection.index);
        if (showYear) {
          ctx.fillText(String(d.year), x, chartHeight - 17);
        }

        if (i === selection.index && candleAmount > 0.92) {
          const label = `${d.year} · 约${d.age}岁`;
          ctx.font = "600 11px system-ui, sans-serif";
          const labelWidth = ctx.measureText(label).width + 18;
          const labelX = Math.max(plotLeft + labelWidth / 2, Math.min(plotRight - labelWidth / 2, x));
          const labelY = Math.max(plotTop + 14, Math.min(plotBottom - 18, highY - 24));
          ctx.globalAlpha = 0.92 * candleAmount;
          ctx.fillStyle = themeColors.labelBg;
          roundedRect(ctx, labelX - labelWidth / 2, labelY - 11, labelWidth, 22, 11);
          ctx.fill();
          ctx.strokeStyle = themeColors.labelBorder;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = themeColors.labelText;
          ctx.textBaseline = "middle";
          ctx.fillText(label, labelX, labelY + 0.5);
        }
        ctx.restore();
      });

      if (playback.state === "opening") {
        ctx.save();
        ctx.fillStyle = themeColors.opening;
        ctx.textAlign = "center";
        ctx.font = "600 19px 'Songti SC', SimSun, serif";
        ctx.fillText("从一根低位开盘，走向一个王朝的高点", chartWidth / 2, 93);
        ctx.font = "12px system-ui, sans-serif";
        ctx.fillStyle = themeColors.openingMuted;
        ctx.fillText("点击播放，让镜头沿二十七个节点向前", chartWidth / 2, 119);
        ctx.restore();
      }
    }

    function animate(now) {
      const dt = Math.min(40, now - lastFrame);
      lastFrame = now;
      const timelineEase = reducedMotion.matches ? 0.45 : 1 - Math.pow(0.9, dt / 16.67);
      if (playback.playing) {
        advanceStateMachine(dt);
        timeline.scrollLeft += (timelineFollow.target - timeline.scrollLeft) * timelineEase;
      }
      if (camera.settling) {
        const easeBase = reducedMotion.matches ? 0.7 : (camera.fastCatchUp ? 0.84 : 0.94);
        const cameraEase = 1 - Math.pow(easeBase, dt / 16.67);
        camera.x += (camera.targetX - camera.x) * cameraEase;
        camera.y += (camera.targetY - camera.y) * cameraEase;
        camera.zoom += (camera.targetZoom - camera.zoom) * cameraEase;
        camera.valueZoom += (camera.targetValueZoom - camera.valueZoom) * cameraEase;
        const settled = Math.abs(camera.targetX - camera.x) < 0.15
          && Math.abs(camera.targetY - camera.y) < 0.015
          && Math.abs(camera.targetZoom - camera.zoom) < 0.0005
          && Math.abs(camera.targetValueZoom - camera.valueZoom) < 0.0005;
        if (settled) snapCameraToTargets();
      }
      drawChart();
      requestAnimationFrame(animate);
    }

    playButton.addEventListener("click", togglePlay);
    gateButton.addEventListener("click", continueFromGate);
    prevButton.addEventListener("click", () => jumpTo(selection.index - 1, true));
    nextButton.addEventListener("click", () => jumpTo(selection.index + 1, true));
    document.getElementById("restartButton").addEventListener("click", restart);
    document.addEventListener("keydown", (event) => {
      const interactive = event.target.closest?.("button, input, textarea, select, a");
      if (event.code !== "Space" || event.repeat || interactive || !window.matchMedia("(pointer: fine)").matches) return;
      if (playback.state === "opening" || playback.state === "chapterReview") {
        event.preventDefault();
        continueFromGate();
      }
    });
    window.addEventListener("resize", () => {
      resizeCanvas();
      setChapterTarget(selection.index, true);
      syncPlaybackControls();
    });
    window.addEventListener("error", (event) => {
      const badge = document.getElementById("errorBadge");
      badge.style.display = "block";
      badge.textContent = `JavaScript 错误：${event.message}`;
    });

    try {
      validateData();
      setupThemeUI();
      setupStaticUI();
      resizeCanvas();
      restart();
      requestAnimationFrame(animate);
      window.__lifeKlineDebug = {
        candles,
        validateData,
        getState: () => ({
          playbackState: playback.state,
          playing: playback.playing,
          currentIndex: selection.index,
          revealed: selection.index + 1,
          lineProgress: revealProgress.line,
          movementMs: revealProgress.movementMs,
          activeMs: revealProgress.activeMs,
          candleFront: revealProgress.candle.findLastIndex(value => value > 0),
          volumeFront: revealProgress.volume.findLastIndex(value => value > 0),
          currentCandleAmount: revealProgress.candle[selection.index],
          currentVolumeAmount: revealProgress.volume[selection.index],
          camera: {
            x: camera.x,
            targetX: camera.targetX,
            y: camera.y,
            targetY: camera.targetY,
            zoom: camera.zoom,
            targetZoom: camera.targetZoom,
            valueZoom: camera.valueZoom,
            targetValueZoom: camera.targetValueZoom,
            settling: camera.settling
          }
        }),
        jumpTo: (index) => jumpTo(index, true),
        advance: advanceStateMachine,
        continueFromGate,
        setTheme: applyTheme,
        getTheme: () => ({ ...themeState }),
        timelineState: () => ({ scrollLeft: timeline.scrollLeft, target: timelineFollow.target }),
        timing: { trajectoryMs: TRAJECTORY_MOVE_MS, candleDelayMs: CANDLE_DELAY_MS, volumeDelayMs: VOLUME_DELAY_MS },
        cameraZoom: CAMERA_ZOOM
      };
    } catch (error) {
      const badge = document.getElementById("errorBadge");
      badge.style.display = "block";
      badge.textContent = `初始化失败：${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
