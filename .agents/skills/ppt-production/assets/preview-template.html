<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT preview stage</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
      --safe-x: 96px;
      --safe-y: 72px;
      --scale: 1;
      --canvas: #ffffff;
      --ink: #111111;
      --accent: #d04a32;
      --muted: #6f6f6f;
      --font-display: system-ui, sans-serif;
      --font-body: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #111; font-family: var(--font-body); }
    .stage {
      position: absolute; left: 50%; top: 50%; width: var(--stage-width); height: var(--stage-height);
      transform: translate(-50%, -50%) scale(var(--scale)); transform-origin: center;
      overflow: hidden; background: var(--canvas); color: var(--ink);
    }
    .safe { position: absolute; inset: var(--safe-y) var(--safe-x); }
    .technical-label { font: 700 18px/1 ui-monospace, monospace; letter-spacing: .12em; }
    .slide-number { position: absolute; right: var(--safe-x); bottom: 28px; font: 700 18px/1 ui-monospace, monospace; }
    .source { position: absolute; left: var(--safe-x); bottom: 28px; color: var(--muted); font: 700 14px/1 ui-monospace, monospace; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main class="stage" data-render-mode="object">
    <div class="safe">
      <!-- Generate slide-specific content from slide-spec.json here. -->
    </div>
    <div class="source">SOURCE</div>
    <div class="slide-number">01 / 01</div>
  </main>
  <script>
    const fit = () => document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
    addEventListener('resize', fit, { passive: true });
    fit();
  </script>
</body>
</html>
